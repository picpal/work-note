packages:
  - "."

# pnpm 11에서 onlyBuiltDependencies → allowBuilds 로 키가 바뀌었다.
# 의도는 동일: 빌드 스크립트 실행은 esbuild에만 허용하고 나머지는 전부 차단한다.
allowBuilds:
  esbuild: true

# 공급망 보안 (pnpm 11.5.3에서 전부 지원 — 각 설정 옆에 도입 버전 표기).
# 갓 배포된 악성 버전(shai-hulud류 계정 탈취 후 즉시 publish) 유입을 시간으로 차단한다.
# 7일(10080분)은 pnpm/semgrep 권고치이자, 실제 npm 탈취 사건이 탐지·unpublish 되기까지의 관측 구간을 덮는다.
# 폐쇄망 사내 도구라 당일 릴리스를 급히 받을 이유가 없어 지연 비용이 사실상 0. (v10.16.0+)
minimumReleaseAge: 10080

# 이전 버전이 가졌던 신뢰 근거(provenance/trusted publisher)가 사라진 버전을 거부 = 계정 탈취 탐지. (v10.21.0+)
trustPolicy: no-downgrade

# 아래 2건은 오탐(구 메이저 유지보수 백포트)이라 정확한 버전으로만 예외 처리한다.
# pnpm의 신뢰 검사는 semver가 아닌 "배포 시각"만 본다 → 신 메이저가 먼저 신뢰 근거를 갖추면
# 나중에 나온 구 메이저 백포트가 downgrade로 오인된다.
#   semver@6.3.1  (2023-07-10, 근거 없음) vs semver 7.5.1 (2023-05-12, provenance)
#   vite@5.4.21   (2025-10-20, provenance) vs vite 7.1.3  (2025-08-19, trusted publisher)
# 둘 다 devDependency 전용 전이 의존(@babel/core←@vitejs/plugin-react, vitest)이라 배포 번들에 없다.
# 버전 고정 예외라 락파일이 다른 버전으로 올라가면 검사가 자동 재개된다(패키지 전체 면제 아님).
trustPolicyExclude:
  - semver@6.3.1
  - vite@5.4.21

# 전이 의존이 git/tarball/http 등 레지스트리 밖 출처로 들어오는 것을 차단. 현재 락파일 349건은 전부
# registry integrity 해석이라 무영향, 앞으로의 회귀를 막는 가드다. (v10.26.0+)
blockExoticSubdeps: true

# 보안: mermaid가 번들한 dompurify까지 패치 버전으로 끌어올림 (GHSA-cmwh-pvxp-8882, <=3.4.10).
#       2026-08-07 감사에서 GHSA-c2j3-45gr-mqc4(<=3.4.11)로 플로어 재상향 — dompurify는 이 앱 XSS 방어의 단일 의존성.
#       mermaid 10.9.6의 요구 범위가 ^3.2.4라 직접 의존과 동시 만족(중복 설치 없음).
# uuid는 mermaid 10.x가 v9 API에 의존 → v11 강제 시 깨질 위험 + buf 미전달로 비익스플로잇 → 미오버라이드.
overrides:
  dompurify: '>=3.4.13'

