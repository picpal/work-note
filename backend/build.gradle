plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.worknote'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 수동 핀은 BOM보다 우선하므로, BOM이 따라잡은 뒤에도 남아 있으면 Boot을 올려도 조용히 다운그레이드시킨다
// (2026-08-07 보안감사 M-7: logback 핀 1.5.33이 BOM 1.5.34를 막고 있었다).
// 따라서 BOM보다 높여야 하는 것만 남긴다 — 나머지(assertj·tomcat·logback)는 3.5.16 BOM 값과 동일해 제거.
ext['jackson-bom.version'] = '2.21.5'   // BOM 2.21.4 → CVE-2026-54515·59889, GHSA-mhm7 해소

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.4'
}

tasks.named('test') {
    useJUnitPlatform()
}

// frontend dist를 jar에 포함 (선행: cd frontend && pnpm build)
processResources {
    from("${rootDir}/../frontend/dist") { into 'static' }
}

// bootJar만 가드 — test/bootRun은 dist 없이도 동작해야 함 (백엔드 단독 개발)
tasks.named('bootJar') {
    doFirst {
        if (!file("${rootDir}/../frontend/dist/index.html").exists()) {
            throw new GradleException("frontend/dist 없음 — 먼저 실행: cd ../frontend && pnpm build")
        }
    }
}
